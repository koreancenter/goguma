<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GOGUMA — Web & App Specification Architect</title>
    <meta name="description" content="Ultra-Luxury Minimalist PRD & Software Specification Studio. Architect web and app specifications with live real-time visual manifestation and 11 production-grade documents." />
    <meta property="og:title" content="GOGUMA — Web & App Specification Architect" />
    <meta property="og:description" content="Ultra-Luxury Minimalist PRD & Software Specification Studio. Architect web and app specifications with live real-time visual manifestation and 11 production-grade documents." />

    <script>
      (function () {
        try {
          var saved = localStorage.getItem('goguma_theme');
          var valid = saved === 'sejong' || saved === 'spring' || saved === 'summer' || saved === 'autumn' || saved === 'winter';
          var themeId = valid ? saved : 'sejong';
          document.documentElement.dataset.theme = themeId;
          document.documentElement.style.colorScheme = themeId === 'winter' ? 'dark' : 'light';
          if (themeId === 'winter') {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {}
      })();
    </script>

    <!-- Resource Preconnects for Swift Network Handshake -->
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossOrigin="anonymous" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossOrigin="anonymous" />

    <!-- SUIT Variable for Refined Korean Sans-Serif Legibility -->
    <link
      rel="stylesheet"
      as="style"
      crossorigin="anonymous"
      href="https://cdn.jsdelivr.net/gh/sun-typeface/SUIT@2/fonts/variable/woff2/SUIT-Variable.css"
    />

    <!-- DM Sans (400, 500, 600, 700) for Architectural UI & Numerical Typography -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&display=swap"
    />

    <!-- Plus Jakarta Sans (500, 600, 700, 800) for Editorial Architectural Display Typography -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap"
    />

    <!-- JetBrains Mono strictly for Code-Viewer Blocks -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap"
    />
  </head>
  <body class="bg-[var(--theme-canvas)] text-[var(--theme-ink-body)] font-sans antialiased text-[15.5px] leading-[1.75] tracking-[-0.01em] selection:bg-[var(--theme-ink-strong)] selection:text-[var(--theme-canvas)]">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
